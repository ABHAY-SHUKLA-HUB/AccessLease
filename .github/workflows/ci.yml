name: AccessLease CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build & Unit Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Validate frontend staging
        run: npm --prefix backend run stage:frontend

      - name: Execute automated unit test suite
        run: npm --prefix backend run test:unit
        env:
          NODE_ENV: test
